name: CI

on:
  push:
    branches: [main, other]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # The marketplace installer runs `npm install` with lifecycle scripts
      # DISABLED, so it never runs `prepare`/`tsc` — the committed dist/ is what
      # actually ships. Here `npm ci` DOES run `prepare` (rebuilding dist/), so
      # the next step can assert the committed dist/ matches a fresh build and
      # guarantee the runtime on `main` (served verbatim by the marketplace) is
      # always in sync with src/.
      - name: Install (prepare rebuilds dist/)
        run: npm ci

      - name: Committed dist/ is in sync with src/ (marketplace serves this)
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of sync with src/ — run 'npm run build' and commit dist/"
            git --no-pager diff --stat -- dist
            exit 1
          fi

      - name: Verify the runtime the hooks & MCP point at exists
        run: |
          test -f dist/hosts/claude-code/entrypoints/pre.js
          test -f dist/hosts/claude-code/entrypoints/post.js
          test -f dist/mcp/consult-server.js
          test -f dist/cli/projects.js

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Validate plugin & marketplace manifests
        run: npm run validate:manifests
