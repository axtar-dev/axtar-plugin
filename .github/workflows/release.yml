name: Release

# Publishes a GitHub Release when an `axtar--v*` tag is pushed. That tag is
# created only by `npm run release:{patch,minor,major}` (via `npm version`), so
# this NEVER fires on a normal commit — only on a deliberate release.
#
# The release procedure lives in RELEASE.md.

on:
  push:
    tags: ['axtar--v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify the tag matches the manifest version
        id: ver
        run: |
          PLUGIN_V="$(node -p "require('./.claude-plugin/plugin.json').version")"
          PKG_V="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./.claude-plugin/plugin.json').name")"
          if [ "$PLUGIN_V" != "$PKG_V" ]; then
            echo "::error::version mismatch — plugin.json=$PLUGIN_V package.json=$PKG_V"
            exit 1
          fi
          EXPECTED="${NAME}--v${PLUGIN_V}"
          if [ "${GITHUB_REF_NAME}" != "$EXPECTED" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version (expected $EXPECTED)"
            exit 1
          fi
          echo "version=$PLUGIN_V" >> "$GITHUB_OUTPUT"
          echo "tag=$EXPECTED" >> "$GITHUB_OUTPUT"

      - name: Install (prepare builds dist/)
        run: npm ci

      - name: Build + test + validate before publishing
        run: |
          test -f dist/hosts/claude-code/entrypoints/pre.js
          test -f dist/mcp/consult-server.js
          npm test
          npm run validate:manifests

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "axtar v${{ steps.ver.outputs.version }}" \
            --generate-notes
